<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#22385f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TOPIK II Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece8df; --card:#fffdf8; --ink:#24262b; --pine:#22385f; --pine-dark:#172845;
  --red:#a13327; --green:#2f6b4a; --muted:#7d7360; --gold:#b8921c; --rule:rgba(42,37,30,0.18);
  --on-pine:#f3f1ea; --tint:rgba(34,56,95,0.07); --hl:#fbf0d4;
  --serif:'Source Serif 4', 'Noto Serif KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Georgia, serif;
  --mono:'IBM Plex Mono', 'Noto Sans KR', ui-monospace, Menlo, Consolas, monospace;
  --type:'Special Elite', 'Noto Sans KR', 'Courier New', monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17191d; --card:#22252b; --ink:#e8e6e0; --pine:#8fb0e8; --pine-dark:#7398d6;
    --red:#e2746a; --green:#6fcf9f; --muted:#a89f90; --gold:#e0b949; --rule:rgba(236,228,214,0.16);
    --on-pine:#121418; --tint:rgba(143,176,232,0.12); --hl:#3a3420;
  }
}
:root[data-theme="dark"]{
  --paper:#17191d; --card:#22252b; --ink:#e8e6e0; --pine:#8fb0e8; --pine-dark:#7398d6;
  --red:#e2746a; --green:#6fcf9f; --muted:#a89f90; --gold:#e0b949; --rule:rgba(236,228,214,0.16);
  --on-pine:#121418; --tint:rgba(143,176,232,0.12); --hl:#3a3420;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:16px; line-height:1.55; display:flex; justify-content:center; padding:24px 14px 64px; }
.app{ width:100%; max-width:700px; }
button{ font:inherit; }
.sticky-header{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; }
.drawer-tab{ background:var(--pine); color:var(--on-pine); border-radius:6px 6px 0 0; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:var(--type); letter-spacing:0.06em; font-size:13px; box-shadow:0 2px 0 var(--pine-dark); }
.drawer-tab .where{ font-family:var(--mono); font-size:11.5px; letter-spacing:0; opacity:0.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn{ background:transparent; border:1px solid var(--on-pine); color:var(--on-pine); border-radius:4px; padding:4px 8px; cursor:pointer; font-size:14px; line-height:1; }
main{ background:var(--card); border:1px solid var(--rule); border-top:none; border-radius:0 0 6px 6px; box-shadow:0 10px 24px -12px rgba(42,37,30,0.35); padding:30px 30px 34px; min-height:380px; }
@media (max-width:520px){ main{ padding:22px 16px 26px; } body{ padding:12px 8px 48px; } }

h1{ font-size:25px; line-height:1.25; margin:0 0 6px; }
h2{ font-family:var(--type); font-weight:400; font-size:20px; margin:0; letter-spacing:0.03em; }
p.sub{ color:var(--muted); margin:0 0 22px; font-size:15px; }
.btn{ font-family:var(--mono); font-size:13px; padding:10px 16px; border-radius:4px; border:1px solid var(--pine); background:var(--pine); color:var(--on-pine); cursor:pointer; min-height:42px; }
.btn:hover{ background:var(--pine-dark); }
.btn.ghost{ background:transparent; color:var(--pine); }
.btn.ghost:hover{ background:var(--tint); }
.btn.small{ padding:6px 11px; font-size:12px; min-height:34px; }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }
.btn:focus-visible, .icon-btn:focus-visible, .task-row:focus-visible, input:focus-visible, textarea:focus-visible, .tile:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.ai-only{ display:none !important; }
html.has-ai .ai-only{ display:inline-flex !important; }
html.has-ai div.ai-only{ display:block !important; }

/* Home */
.sec{ border-top:1px dashed var(--rule); padding:20px 0 6px; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
.sec-meta{ font-size:13px; color:var(--muted); }
.task-row{ width:100%; text-align:left; display:flex; gap:12px; align-items:center; justify-content:space-between; background:transparent; border:1px solid var(--rule); border-radius:6px; padding:11px 14px; margin-bottom:8px; cursor:pointer; color:var(--ink); }
.task-row:hover{ border-color:var(--pine); background:var(--tint); }
.task-row .nm{ font-weight:600; font-size:15.5px; }
.task-row .bl{ font-size:13.5px; color:var(--muted); }
.badge{ flex-shrink:0; font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:10px; border:1px solid var(--rule); color:var(--muted); white-space:nowrap; }
.badge.on{ border-color:var(--pine); color:var(--pine); background:var(--tint); }
details.settings{ margin-top:22px; border-top:1px solid var(--rule); padding-top:14px; }
details.settings summary{ cursor:pointer; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
.set-grid{ display:grid; gap:14px; margin-top:14px; }
.seg{ display:flex; flex-wrap:wrap; border:1px solid var(--pine); border-radius:4px; overflow:hidden; }
.seg button{ flex:1 1 auto; border:none; background:transparent; color:var(--pine); padding:8px 10px; font-family:var(--mono); font-size:12px; cursor:pointer; min-height:38px; }
.seg button.active{ background:var(--pine); color:var(--on-pine); }
.seg button + button{ border-left:1px solid var(--pine); }
.check{ display:flex; gap:9px; align-items:flex-start; font-size:14.5px; }
.check input{ width:18px; height:18px; margin-top:3px; accent-color:var(--pine); }
.lbl{ font-family:var(--mono); font-size:12px; color:var(--pine); margin-bottom:6px; display:block; }
.hint{ font-size:13px; color:var(--muted); }
.voice-grid{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px 10px; align-items:center; font-size:14px; }
.voice-grid select{ width:100%; min-width:0; font-family:var(--serif); font-size:14px; padding:8px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); min-height:38px; }

/* Task shell */
.task-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
.task-how{ color:var(--muted); font-size:14.5px; margin:0 0 16px; }
.set-bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--tint); border-radius:4px; margin-bottom:20px; font-size:14px; }
.set-bar .ttl{ font-weight:600; }
.set-bar .ttl span{ font-family:var(--mono); font-weight:500; font-size:12px; color:var(--muted); margin-right:6px; }

/* Reading */
.ctw{ font-size:17px; line-height:2.25; }
.ctw-word{ white-space:nowrap; }
.ctw-in{ font-family:var(--mono); font-size:16px; padding:1px 3px; border:none; border-bottom:2px solid var(--pine); background:var(--hl); color:var(--ink); border-radius:2px 2px 0 0; letter-spacing:0.08em; }
.ctw-in.ok{ border-color:var(--green); color:var(--green); }
.ctw-in.bad{ border-color:var(--red); color:var(--red); text-decoration:line-through; }
.ctw-boxes{ display:inline-flex; gap:2px; margin-left:1px; vertical-align:baseline; }
.ctw-box{ width:1.35em; height:1.7em; padding:0; text-align:center; font-family:var(--mono); font-size:16px; border:none; border-bottom:2px solid var(--pine); background:var(--hl); color:var(--ink); border-radius:3px 3px 0 0; caret-color:var(--pine); }
.ctw-box:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
.ctw-box.ok{ border-color:var(--green); color:var(--green); }
.ctw-box.bad{ border-color:var(--red); color:var(--red); }
.fix{ font-family:var(--mono); font-size:12px; color:var(--green); margin-left:2px; }
.doc{ border:1px solid var(--rule); border-left:4px solid var(--gold); background:var(--paper); padding:16px 18px; border-radius:4px; white-space:pre-wrap; font-size:15.5px; margin-bottom:22px; }
.doc .kind{ font-family:var(--type); font-size:12px; color:var(--muted); display:block; margin-bottom:6px; white-space:normal; }
.passage{ max-height:52vh; overflow:auto; border:1px solid var(--rule); border-radius:4px; padding:14px 18px; margin-bottom:22px; background:var(--paper); }
.passage p{ margin:0 0 12px; }
.passage h3{ margin:0 0 10px; font-size:18px; }
.pnum{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-right:6px; }

/* Strategy drills */
.strat-tip{ border-left:4px solid var(--gold); background:var(--paper); padding:10px 14px; border-radius:4px; font-size:14.5px; margin-bottom:16px; }
.skim-box{ border:1px solid var(--rule); border-radius:6px; padding:16px 18px; background:var(--paper); }
.skim-box h3{ margin:0 0 12px; font-size:19px; }
.skim-para{ margin-bottom:14px; }
.skim-para .ts{ font-weight:600; }
.bar{ display:block; height:9px; background:var(--rule); border-radius:5px; margin:7px 0; }
mark.ts{ background:var(--hl); color:inherit; padding:0 2px; border-radius:2px; }
.tw{ text-decoration:underline; text-decoration-color:var(--pine); text-decoration-thickness:2px; text-underline-offset:3px; font-weight:600; }
.trans-text{ font-size:16.5px; line-height:2.2; }
.tsel{ font-family:var(--serif); font-size:15px; padding:4px 6px; border:1px solid var(--pine); border-radius:4px; background:var(--hl); color:var(--ink); max-width:100%; }
.tsel.ok{ border-color:var(--green); color:var(--green); } .tsel.bad{ border-color:var(--red); color:var(--red); }
.func{ font-family:var(--mono); font-size:12px; color:var(--pine); }
details.guide{ border:1px solid var(--rule); border-radius:6px; padding:10px 14px; }
details.guide summary{ cursor:pointer; font-family:var(--mono); font-size:13px; color:var(--pine); }
details.guide table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
details.guide td{ border-top:1px solid var(--rule); padding:8px 6px; vertical-align:top; }
details.guide td:first-child{ width:42%; }
.vic-item{ border-top:1px solid var(--rule); padding:14px 0 6px; }
.vic-text{ font-size:16.5px; margin:0 0 10px; }
.target{ background:var(--hl); padding:0 3px; border-radius:2px; }
.vic-item.checked .clue{ text-decoration:underline wavy var(--green); text-underline-offset:4px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); border-radius:16px; padding:5px 12px; font-size:14px; cursor:pointer; }
.chip input{ accent-color:var(--pine); }
.chip.right{ border-color:var(--green); background:rgba(47,107,74,0.10); } .chip.wrong{ border-color:var(--red); background:rgba(161,51,39,0.08); }
.why{ font-size:14px; color:var(--muted); border-left:3px solid var(--pine); padding:4px 0 4px 10px; margin:6px 0 4px; }

/* Note-taking */
.pad{ border:1px solid var(--pine); border-radius:6px; overflow:hidden; background:var(--card); }
.pad-keys{ display:flex; flex-wrap:wrap; gap:4px; padding:8px; background:var(--tint); border-bottom:1px solid var(--rule); }
.pad-key{ font-family:var(--mono); font-size:14px; min-width:38px; min-height:36px; padding:4px 7px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); cursor:pointer; }
.pad-key:hover{ border-color:var(--pine); }
.pad-ta{ display:block; width:100%; min-height:240px; border:none; resize:vertical; padding:12px 14px; font-family:var(--mono); font-size:15px; line-height:1.6; background:var(--card); color:var(--ink); }
.pad-ta:focus-visible{ outline:none; box-shadow:inset 0 0 0 2px var(--gold); }
.pad-foot{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 10px; border-top:1px solid var(--rule); font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.notes-font{ font-family:var(--mono); font-size:14px; }
mark.att{ background:var(--hl); color:inherit; font-weight:600; padding:0 2px; border-radius:2px; }
td.sym{ font-family:var(--mono); font-size:16px; width:70px; }
.field-in{ width:100%; font-family:var(--serif); font-size:15px; padding:9px 12px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); }

.skeleton{ font-family:var(--mono); font-size:14.5px; line-height:2.3; white-space:pre-wrap; border:1px solid var(--rule); border-radius:6px; padding:12px 14px; background:var(--paper); overflow-x:auto; }
.gap-in{ font-family:var(--mono); font-size:14.5px; padding:2px 5px; border:none; border-bottom:2px solid var(--pine); background:var(--hl); color:var(--ink); border-radius:2px 2px 0 0; max-width:60vw; }
.gap-in.ok{ border-color:var(--green); color:var(--green); } .gap-in.bad{ border-color:var(--red); color:var(--red); text-decoration:line-through; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
@media (max-width:560px){ .two-col{ grid-template-columns:1fr; } }

/* MCQ */
fieldset.q{ border:none; padding:0; margin:0 0 20px; }
fieldset.q legend{ font-weight:600; margin-bottom:8px; padding:0; }
label.opt{ display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border:1px solid var(--rule); border-radius:4px; margin-bottom:6px; cursor:pointer; font-size:15px; }
label.opt:hover{ border-color:var(--pine); }
label.opt input{ margin-top:4px; accent-color:var(--pine); width:16px; height:16px; flex-shrink:0; }
label.opt.right{ border-color:var(--green); background:rgba(47,107,74,0.10); }
label.opt.wrong{ border-color:var(--red); background:rgba(161,51,39,0.08); }
.result{ margin-top:16px; text-align:center; }
.stamp{ display:inline-block; font-family:var(--type); font-size:20px; letter-spacing:0.08em; padding:6px 20px; border:3px solid currentColor; border-radius:4px; transform:rotate(-3deg); }
.stamp.good{ color:var(--green); } .stamp.mid{ color:var(--gold); } .stamp.low{ color:var(--red); }

/* Listening */
.player{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px; border:1px dashed var(--pine); border-radius:6px; margin-bottom:20px; }
.player .state{ font-family:var(--mono); font-size:12.5px; color:var(--muted); }
.transcript{ margin-top:14px; padding:12px 14px; background:var(--paper); border-radius:4px; font-size:14.5px; }
.transcript p{ margin:0 0 6px; }
.transcript b{ color:var(--pine); }
.resp-item{ border-top:1px solid var(--rule); padding-top:14px; margin-top:6px; }
.resp-item .said{ font-style:italic; color:var(--muted); font-size:14px; margin-top:6px; display:none; }
.resp-item.done .said{ display:block; }

/* Build */
.bubble{ display:inline-block; background:var(--paper); border:1px solid var(--rule); border-radius:14px 14px 14px 3px; padding:8px 14px; margin-bottom:10px; }
.build-item{ border-top:1px solid var(--rule); padding:16px 0 6px; }
.answer-line{ min-height:50px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px; border:2px dashed var(--rule); border-radius:6px; margin-bottom:10px; }
.answer-line.ok{ border-color:var(--green); border-style:solid; }
.answer-line.bad{ border-color:var(--red); border-style:solid; }
.answer-line .ph{ color:var(--muted); font-size:13px; }
.tile-pool{ display:flex; flex-wrap:wrap; gap:6px; }
.tile{ font-family:var(--serif); font-size:15.5px; padding:6px 12px; border-radius:4px; border:1px solid var(--pine); background:var(--card); color:var(--ink); cursor:pointer; min-height:38px; }
.tile.placed{ background:var(--tint); }
.tile[disabled]{ cursor:default; }
.correct-ans{ font-size:14px; color:var(--green); margin-top:6px; }

/* Writing */
.prompt-box{ border:1px solid var(--rule); border-radius:6px; padding:16px 18px; margin-bottom:18px; background:var(--paper); }
.prompt-box ul{ margin:8px 0 0; padding-left:22px; }
.post{ border-left:3px solid var(--pine); padding:4px 0 4px 12px; margin:12px 0 0; font-size:15px; }
.post b{ font-family:var(--mono); font-size:12.5px; color:var(--pine); font-weight:600; }
textarea.write{ width:100%; min-height:230px; resize:vertical; font-family:var(--serif); font-size:16px; line-height:1.6; padding:12px 14px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); }
.write-bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 14px; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
.timer{ font-family:var(--mono); font-size:15px; color:var(--pine); padding:4px 10px; border:1px solid var(--pine); border-radius:4px; }
.timer.out{ color:var(--red); border-color:var(--red); }
.model{ white-space:pre-wrap; padding:14px 16px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:15px; margin-top:12px; }

/* Feedback */
.fb{ margin-top:18px; border:1px solid var(--pine); border-radius:6px; padding:16px 18px; }
.fb .score{ font-family:var(--type); font-size:30px; color:var(--pine); }
.fb h4{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--pine); margin:14px 0 6px; }
.fb ul{ margin:0; padding-left:20px; }
.fb li{ margin-bottom:5px; }
.corr{ border-top:1px solid var(--rule); padding:8px 0; font-size:14.5px; }
.corr .o{ color:var(--red); text-decoration:line-through; }
.corr .n{ color:var(--green); font-weight:600; }
.corr .w{ color:var(--muted); font-size:13.5px; }
.thinking{ font-family:var(--mono); font-size:13px; color:var(--muted); }
.notice{ margin-top:12px; padding:10px 14px; border-radius:4px; font-size:14px; border:1px solid var(--rule); }
.notice.err{ color:var(--red); border-color:var(--red); }
.notice.info{ color:var(--pine); border-color:var(--pine); background:var(--tint); }

/* Speaking */
.big-step{ font-family:var(--type); font-size:15px; color:var(--muted); margin-bottom:10px; }
.mic{ display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; color:var(--red); }
.mic .dot{ width:10px; height:10px; border-radius:50%; background:var(--red); animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:0.3; } }
@media (prefers-reduced-motion: reduce){ .mic .dot{ animation:none; } }
.diff{ font-size:17px; line-height:1.8; margin:10px 0; }
.diff .hit{ color:var(--green); }
.diff .miss{ color:var(--red); text-decoration:underline wavy; text-underline-offset:4px; }
.heard{ font-size:14px; color:var(--muted); }
.live{ min-height:60px; padding:10px 12px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:15px; margin:10px 0; }
.score-list{ font-family:var(--mono); font-size:13px; }
.score-list div{ display:flex; justify-content:space-between; border-bottom:1px solid var(--rule); padding:5px 0; }

.check-bar{ position:sticky; bottom:0; z-index:20; display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:nowrap; margin:10px -8px 0; padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--rule); }
.check-bar .answered{ margin-right:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:12px; color:var(--muted); }
.check-bar .btn{ flex-shrink:0; white-space:nowrap; }
.sheet{ position:fixed; inset:0; z-index:200; background:var(--card); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.sheet-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule); }
.sheet-body{ flex:1; overflow:auto; padding:16px 18px 40px; font-size:16.5px; line-height:1.65; overscroll-behavior:contain; }
.sheet-body p{ margin:0 0 14px; }
body.sheet-open{ overflow:hidden; }
/* Phones and tablets: 48px touch targets (Android guideline) and no nested scrolling */
@media (pointer: coarse){
  .btn{ min-height:48px; } .btn.small{ min-height:44px; padding:8px 13px; }
  .icon-btn{ min-width:44px; min-height:40px; }
  label.opt{ padding:13px 14px; min-height:48px; align-items:center; }
